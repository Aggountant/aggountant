# shipshape-ci:managed — regenerated by /shipshape-ci; edit OSS-RELEASE.md and re-run
name: CI

# Hosted CI runs only in the public repository: every job is guarded by
# `github.repository == 'aggountant/aggountant'`, so forks and private mirrors
# spend no Actions minutes. The same gates run locally via scripts/ci-local.sh.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + test on Linux and macOS, stable and MSRV, so the JCS golden
  # fixtures are proven reproducible (no accidental platform/locale/toolchain
  # dependency in the canonical hashing path).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    if: github.repository == 'aggountant/aggountant'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, 1.89.0] # 1.89.0 == workspace rust-version (MSRV)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - run: cargo build --workspace --locked
      # Includes the golden-fixture test and the layering test.
      - run: cargo test --workspace --locked --no-fail-fast

  lint:
    name: fmt + clippy
    if: github.repository == 'aggountant/aggountant'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Structural supply-chain supervision (advisories, bans, licenses, sources).
  # The layer-direction and Store-boundary rules are enforced by the
  # `layering` test above.
  deny:
    name: cargo-deny
    if: github.repository == 'aggountant/aggountant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # The user guide: fi/en page pairs, relative links and anchors, the site
  # build (site/, with its own link validation), and the practice month run
  # against the freshly built binary in a throwaway home.
  user-guide:
    name: user guide
    if: github.repository == 'aggountant/aggountant'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: scripts/check-user-guide.sh
