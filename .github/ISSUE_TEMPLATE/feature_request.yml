name: Feature request
description: Suggest a new capability or a change to existing behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What bookkeeping task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like aggountant or its skills to do.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant rules (for example the Finnish Accounting Act or Vero.fi guidance), alternatives you considered.
