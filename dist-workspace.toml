# Generated by `shipshape dist generate` from OSS-RELEASE.md `distribution`.
# Edit distribution.* in OSS-RELEASE.md, then re-run `shipshape dist generate`.
# The tag-triggered `.github/workflows/release.yml` is produced from the
# [dist] section below via `dist generate` — never hand-edit the workflow.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
hosting = "github"
github-attestations = true
pr-run-mode = "skip"

# GitHub retired the macos-14 image that cargo-dist 0.33 picks by default for
# aarch64-apple-darwin ("configuration 'macos-14-arm64-us-default' is not
# supported", release v0.1.0 attempt 2026-11-19). Keep this override if the
# file is regenerated with `shipshape dist generate --force`.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
